name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate milestone tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate milestone tag
        run: bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"

  # Windows and macOS only run selectively on ordinary commits, so a release must pass them.
  platforms:
    name: Windows and macOS tests
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/platforms.yml

  publish:
    name: Create GitHub Release
    needs: [validate, platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
