name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Wasmtime and bundled SQLite compile substantial native artifacts.
      # Reuse Cargo registry, git dependencies, and target build outputs between runs.
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Start a fresh cache so test-profile dependency artifacts are seeded.
          key: test-profile-v1
          cache-on-failure: true

      - name: Test release tag policy
        run: bash scripts/check-release-tag.sh --self-test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        # Componentization tests are CPU-heavy; bound parallelism so they do not
        # starve lifecycle tests with their own runtime deadlines.
        run: cargo test --all-targets -- --test-threads=2

  # The offline-bundle loader has Windows-specific (reparse point) and Unix-specific
  # (O_NOFOLLOW) code paths, so build and test on every supported desktop OS.
  cross-platform:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: test-profile-v1
          cache-on-failure: true

      - name: Run tests
        run: cargo test --all-targets -- --test-threads=2
