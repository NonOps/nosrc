name: SPEC evaluation

on:
  push:
    branches:
      - main
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: spec-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: Offline and mock-provider corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: test-profile-v1
          cache-on-failure: true

      - name: Run offline and mock-provider corpus
        # This name filter selects deterministic corpus tests only; live_provider_evaluation is never run in required CI.
        run: cargo test --bin nosrc spec_evaluation -- --ignored --test-threads=1
