name: Coverage

on:
  push:
    branches:
      - main
  # Coverage is a trend signal and the most expensive job, so pull requests only run it
  # when the workflow itself changes. Use workflow_dispatch to measure a branch on demand.
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/coverage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-v1
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        # Same bounded parallelism as the main CI job: componentization tests are CPU-heavy.
        # The black-box tests spawn the instrumented binary, so it is covered too.
        run: cargo llvm-cov --all-targets --no-report -- --test-threads=2

      - name: Publish coverage summary
        run: |
          {
            echo "## Test coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

      - name: Enforce minimum line coverage
        # Baseline measured at 77.9% lines; the floor leaves headroom for noise and ratchets up
        # over time. Black-box tests kill the spawned server, so its coverage is under-counted.
        run: cargo llvm-cov report --fail-under-lines 70
