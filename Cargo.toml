[package]
name = "nosrc"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
authors = ["nosrc contributors"]
description = "Specification-driven JavaScript service runtime"
license = "Apache-2.0"

[dependencies]
# Async & Web
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5" }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service", "http1", "http2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Wasmtime & Sandboxing
wasmtime = { version = "50", features = ["component-model", "wat", "async"] }
componentize-qjs = { version = "0.6.0", default-features = false }
tempfile = "3.13"
sha2 = "0.11"
libc = "0.2"
form_urlencoded = "1.2.3"

# State & Persistence
rusqlite = { version = "0.43", features = ["bundled"] }
redb = "4.6"

# Lock-Free Hot-Swapping & Concurrency
arc-swap = "1.7"

# CLI, Config & File Watching
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling & Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.13", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "3.8", features = ["server", "macros", "transport-io", "schemars"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
rmcp = { version = "3.8", features = ["client", "transport-async-rw"] }
